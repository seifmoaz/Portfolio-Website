<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Seif Moaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#0A0A0A; --canvas:#161616; --ink:#FFFFFF; --ink-soft:#B3B3B3;
    --line:rgba(255,255,255,0.14); --line-soft:rgba(255,255,255,0.09); --accent:#B4C57A; --accent-deep:#4F5936;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0; height:100%; overflow:hidden; background:var(--bone); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1{ font-family:'Poppins', sans-serif; font-weight:800; }
  .wrap{ max-width:1320px; margin:0 auto; padding:0 40px; }
  .nav-wrap{ max-width:1680px; padding:0 44px; }

  header{ background:transparent; border-bottom:1px solid var(--line-soft); }
  nav{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; height:88px; column-gap:18px; }
  .logo-mark{ grid-column:1; justify-self:start; display:flex; align-items:center; }
  .logo-mark .mark-fill{ fill:var(--ink); } .logo-mark .mark-stroke{ stroke:var(--accent); }
  .nav-links{ grid-column:2; justify-self:center; display:flex; gap:28px; list-style:none; margin:0; padding:0; }
  .nav-links a{ color:var(--ink); text-decoration:none; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; font-weight:500; opacity:0.8; transition:color .2s ease; }
  .nav-links a.active, .nav-links a:hover{ opacity:1; color:var(--accent); }
  .nav-social{ grid-column:3; justify-self:end; display:flex; gap:16px; }
  .nav-social a{ color:var(--ink); opacity:0.85; display:flex; align-items:center; }

  .menu-toggle{
    display:none; grid-column:1; justify-self:start; background:none; border:none; padding:10px; margin:-10px;
    cursor:pointer; align-items:center; justify-content:center; color:var(--ink);
  }
  .menu-icon{ position:relative; width:19px; height:13px; display:block; }
  .menu-icon span{ position:absolute; left:0; width:100%; height:1.5px; background:currentColor; transition:transform .3s ease, top .3s ease; }
  .menu-icon span:first-child{ top:0; } .menu-icon span:last-child{ top:11px; }
  .menu-toggle.open .menu-icon span:first-child{ transform:rotate(45deg); top:5.5px; }
  .menu-toggle.open .menu-icon span:last-child{ transform:rotate(-45deg); top:5.5px; }

  .mobile-menu{
    position:fixed; inset:0; z-index:60; background:rgba(10,10,10,0.92); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px;
    opacity:0; visibility:hidden; transform:translateY(-10px);
    transition:opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
  }
  .mobile-menu.open{ opacity:1; visibility:visible; transform:translateY(0); transition:opacity .35s ease, transform .35s ease, visibility 0s linear 0s; }
  .mobile-menu-links{ list-style:none; margin:0; padding:0; text-align:center; }
  .mobile-menu-links li{ margin:0 0 26px; } .mobile-menu-links li:last-child{ margin-bottom:0; }
  .mobile-menu-links a{
    font-family:'Poppins', sans-serif; font-weight:700; font-size:30px; text-transform:uppercase;
    letter-spacing:-0.01em; color:#FFFFFF; text-decoration:none; opacity:0.85;
  }
  .mobile-menu-links a.active{ color:var(--accent); opacity:1; }
  .mobile-menu-links a:hover{ opacity:1; color:var(--accent); }
  .mobile-menu-social{ display:flex; gap:26px; }
  .mobile-menu-social a{ color:#FFFFFF; opacity:0.8; display:flex; }
  .mobile-menu-social a:hover{ opacity:1; color:var(--accent); }

  @media (max-width:600px){
    nav{ column-gap:10px; }
    .nav-links, .nav-social{ display:none; }
    .menu-toggle{ display:flex; }
    .logo-mark{ grid-column:3; justify-self:end; }
    .logo-mark svg{ width:26px; height:26px; } .logo-mark a{ padding:8px; margin:-8px; }
  }

  .coming-soon{
    height:calc(100vh - 89px); height:calc(100dvh - 89px);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:0 24px;
  }
  .coming-soon h1{
    font-size:clamp(34px, 8vw, 108px); line-height:1.08; letter-spacing:-0.02em; margin:0; text-transform:uppercase;
  }
  .coming-soon .accent-word{
    display:block; font-family:'Instrument Serif', serif; font-style:italic; font-weight:400;
    color:var(--accent); text-transform:none; letter-spacing:-0.01em;
    font-size:clamp(40px, 10vw, 130px); line-height:1;
  }
  .coming-soon .sub{
    margin-top:26px; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav-wrap">
    <nav>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span class="menu-icon"><span></span><span></span></span>
      </button>
      <div class="logo-mark">
        <a href="index.html" style="display:flex;">
          <svg width="42" height="42" viewBox="0 0 34 34" fill="none" aria-label="Seif logo">
            <circle cx="17" cy="17" r="16" stroke-width="1.2" class="mark-stroke" fill="none"/>
            <text x="17" y="23" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="17" class="mark-fill">S</text>
          </svg>
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="nav-social">
        <a href="#" aria-label="Instagram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
        <a href="#" aria-label="Behance"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7h6.2c2.9 0 3.9 3.4 1.4 4.5 3 .6 3.3 5-.5 5H2V7z"/><path d="M2 11.3h5.6"/><path d="M14 12.2c0-2 1.6-3 3.4-3 2 0 3.4 1.2 3.4 3.3v.4h-5.7c0 1.6 1 2.6 2.4 2.6 1 0 1.7-.4 2-1.1h1.2c-.4 1.4-1.7 2.2-3.2 2.2-2.1 0-3.5-1.5-3.5-3.7v-.7z"/><path d="M15 9.2h4.6"/></svg></a>
        <a href="#" aria-label="LinkedIn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7.5" y1="10" x2="7.5" y2="17"/><circle cx="7.5" cy="6.8" r="0.9" fill="currentColor" stroke="none"/><path d="M11.5 17v-4.3c0-1.5 1-2.4 2.3-2.4 1.3 0 2.2.9 2.2 2.4V17"/></svg></a>
      </div>
    </nav>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <ul class="mobile-menu-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="work.html">Work</a></li>
    <li><a href="photography.html">Photography</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
  <div class="mobile-menu-social">
    <a href="#" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></a>
    <a href="#" aria-label="Behance"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 7h6.2c2.9 0 3.9 3.4 1.4 4.5 3 .6 3.3 5-.5 5H2V7z"/><path d="M2 11.3h5.6"/><path d="M14 12.2c0-2 1.6-3 3.4-3 2 0 3.4 1.2 3.4 3.3v.4h-5.7c0 1.6 1 2.6 2.4 2.6 1 0 1.7-.4 2-1.1h1.2c-.4 1.4-1.7 2.2-3.2 2.2-2.1 0-3.5-1.5-3.5-3.7v-.7z"/><path d="M15 9.2h4.6"/></svg></a>
    <a href="#" aria-label="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7.5" y1="10" x2="7.5" y2="17"/><circle cx="7.5" cy="6.8" r="0.9" fill="currentColor" stroke="none"/><path d="M11.5 17v-4.3c0-1.5 1-2.4 2.3-2.4 1.3 0 2.2.9 2.2 2.4V17"/></svg></a>
  </div>
</div>

<main class="coming-soon">
  <div>
    <h1>Currently<span class="accent-word">developing.</span></h1>
    <p class="sub">Presets, LUTs &amp; more, on the way</p>
  </div>
</main>

<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const mobileMenu = document.getElementById('mobileMenu');
  if(menuToggle && mobileMenu){
    const closeMenu = () => {
      menuToggle.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    };
    const openMenu = () => {
      menuToggle.classList.add('open');
      menuToggle.setAttribute('aria-expanded', 'true');
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
    };
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.contains('open') ? closeMenu() : openMenu();
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  }
</script>

</body>
</html>
